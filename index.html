<!DOCTYPE html>

			margin: 0;
			padding: 0;
			--background: #222;
			--text: #ddd;
			background-color: var(--background);
            color: var(--text);
            fill: var(--text);
		}
		.row-container {
			display: flex;
			width: 100%;
			height: 100%;
			flex-direction: column;
			background-color: var(--background); 
			overflow: hidden;
		}
		.first-row {
			display: flex;

            align-items: center;
            width: 100%;

			& #discord-link {

            }

		.second-row {
			flex-grow: 1;
			border: none;
			margin: 0;
			padding: 0;
		}
    </style>
</head>

<body>
	<div class="row-container">
	<div class="first-row">
		<span>
            <h1>Einzelteile</h1>
        </span>
		<a id="discord-link" href="https://discord.gg/JwyDz85Xe5"><svg width="90" height="90">
